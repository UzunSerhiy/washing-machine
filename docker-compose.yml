services:
  postgres:
    image: postgres:17
    container_name: washing_machine_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: washing_machine_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ESP32_SERIAL_PORT: /dev/ttyACM0
      ESP32_SERIAL_BAUDRATE: "115200"
    ports:
      - '8001:8000'
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    # - "/dev/ttyUSB0:/dev/ttyUSB0"
    group_add:
      - "984"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
